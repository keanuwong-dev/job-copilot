<!doctype html>
<html>
  <body>
    <div class="main-header-logo"><img alt="Northwind" /></div>
    <div class="posting-headline"><h2>Product Engineer</h2></div>
    <div class="posting-categories"><div class="location">New York</div></div>
    <form class="application-form">
      <label>Full name <input name="name" /></label>
      <label>Email <input name="email" type="email" /></label>

      <label>LinkedIn URL <input name="urls[LinkedIn]" /></label>
      <label>Resume <input type="file" name="resume" /></label>
      <button type="submit">Submit application</button>
    </form>
  </body>
</html>
